                "Treatment & Residual Mass Protocols": [
                    { q: "Chemotherapy Regimens (BEP, EP, VIP)", a: "• BEP Regimen:\n  - Bleomycin: 30,000 IU IV (Days 1, 8, 15)\n  - Etoposide: 100 mg/m² IV (Days 1-5)\n  - Cisplatin: 20 mg/m² IV (Days 1-5)\n  - Good Risk: 3 cycles of BEP OR 4 cycles of EP.\n  - Intermediate / Poor Risk: 4 cycles of BEP OR 4 cycles of VIP.\n\n• VIP Regimen (Used if Bleomycin contraindicated due to lung disease):\n  - Etoposide 75 mg/m² (D1-5), Ifosfamide 1,200 mg/m² (D1-5) with Mesna, Cisplatin 20 mg/m² (D1-5) x 4 cycles." },
                    { q: "Residual Mass Management Algorithms", a: "• Seminoma Post-Chemo Residual Mass:\n  - Size <3 cm: Active surveillance.\n  - Size ≥3 cm: 18F-FDG PET-CT at 6-8 weeks post-chemo. If PET negative -> Surveillance. If PET positive -> Surgical resection or biopsy.\n\n• NSGCT Post-Chemo Residual Mass:\n  - Mass ≤1 cm & normalized markers: Surveillance.\n  - Mass >1 cm & normalized markers: Mandatory Nerve-Sparing Retroperitoneal Lymph Node Dissection (RPLND). 50% harbor teratoma, 15% viable GCT." }
                ],
                "Follow-Up & Survivorship": [
                    { q: "Testicular Cancer Surveillance Schedule", a: "• Year 1: H&P and tumor markers q2mo; CT Abdomen/Pelvis q3-4mo; CXR q2mo.\n• Year 2: H&P and markers q3mo; CT A/P q6mo.\n• Years 3-5: Clinic visits q6mo; transition to annual checkups.\n• Long-Term Survivorship: Strictly minimize CT scans after year 3 to reduce secondary radiation-induced malignancies. Screen for metabolic syndrome, cardiovascular disease, and hypogonadism." }
                ]
            },
            "BPH": {
                "Symptom Scoring & Diagnostic Metrics": [
                    { q: "IPSS Severity Classification & Quality of Life", a: "International Prostate Symptom Score (IPSS - Total 35 points):\n• Mild Symptoms: Score 0 - 7 (minimal bother; watchful waiting indicated)\n• Moderate Symptoms: Score 8 - 19 (medical therapy threshold)\n• Severe Symptoms: Score 20 - 35 (combination therapy or surgical evaluation)\n\nQuality of Life (QoL) Bother Score (0 - 6):\n• 0: Delighted | 1: Pleased | 2: Mostly Satisfied | 3: Mixed | 4: Mostly Dissatisfied | 5: Unhappy | 6: Terrible" },
                    { q: "Diagnostic Accuracy of BPH Investigations", a: "• Uroflowmetry (Qmax):\n  - Qmax <10 mL/s: Specificity ~85-90% for bladder outlet obstruction (BOO); Sensitivity ~60-70% (cannot distinguish BOO from detrusor underactivity without urodynamics/PFS)\n  - Qmax >15 mL/s: BOO is unlikely\n  - Minimum voided volume required: ≥150 mL for valid interpretation\n\n• Post-Void Residual (PVR) Ultrasound:\n  - Accuracy: Sensitivity 90-95%, Specificity 95% compared to catheterization\n  - PVR >100-200 mL: Suggests increased risk of acute urinary retention and higher failure rate of medical watchful waiting\n\n• Digital Rectal Examination (DRE) for Volume:\n  - Accuracy: Frequently underestimates prostate volume by 25-35% for glands >40-50 cc compared to TRUS or transabdominal USG." }
                ],
                "Medical & Surgical Protocols": [
                    { q: "Medical Drug Classes & Dosages", a: "• Alpha-1 Blockers (Rapid symptom relief within 48-72 hrs):\n  - Tamsulosin: 0.4 mg PO daily\n  - Alfuzosin: 10 mg PO daily\n  - Silodosin: 8 mg PO daily (high uroselectivity, high incidence of retrograde ejaculation)\n\n• 5-Alpha Reductase Inhibitors (5-ARIs - Long term reduction of volume & retention risk):\n  - Finasteride: 5 mg PO daily\n  - Dutasteride: 0.5 mg PO daily\n  - Indication: Prostate volume >30-40 mL. Lowers serum PSA by ~50% at 6 months (double measured PSA for accurate cancer screening!).\n\n• Combination Therapy (CombAT Protocol):\n  - Alpha-blocker + 5-ARI (e.g., Tamsulosin 0.4mg + Dutasteride 0.5mg daily): Superior in preventing progression and acute urinary retention." },
                    { q: "Surgical Modalities by Gland Size", a: "• Absolute Indications for Surgery: Refractory urinary retention, recurrent UTIs, recurrent gross hematuria, bladder calculi, BPH-induced renal insufficiency.\n• Prostate <80 cc: Bipolar / Monopolar TURP or ThuLEP/HoLEP.\n• Prostate >80 cc: Holmium Laser Enucleation of the Prostate (HoLEP) or Simple Prostatectomy (Robotic/Open).\n• Minimally Invasive Surgical Therapies (MIST): Prostatic Urethral Lift (UroLift), Water Vapor Therapy (Rezum)." }
                ]
            },
            "Nocturnal Enuresis": {
                "Classification & Diagnostic Calculations": [
                    { q: "Clinical Classification (MNE vs. NMNE & Primary vs. Secondary)", a: "• Monosymptomatic Nocturnal Enuresis (MNE):\n  - Bedwetting in children ≥5 years without any daytime lower urinary tract symptoms (urgency, frequency, daytime incontinence).\n• Non-Monosymptomatic Nocturnal Enuresis (NMNE):\n  - Bedwetting accompanied by daytime symptoms (urgency, frequency, daytime wetness, holding maneuvers). Requires daytime bladder evaluation first!\n• Primary: Child has never had a continuous dry period of at least 6 months.\n• Secondary: Enuresis relapses after a period of at least 6 months of continence (screen for psychosocial stress, diabetes, constipation, UTI, OSA)." },
                    { q: "Calculations & Diagnostic Metrics", a: "• Expected Bladder Capacity (EBC for age):\n  - Formula (Koff's formula): EBC (mL) = [Age in years + 1] x 30 mL (valid for ages 4-12)\n\n• Nocturnal Polyuria Index (NPI):\n  - Nocturnal urine volume >130% of Expected Bladder Capacity for age.\n\n• Bladder Diary (Frequency-Volume Chart - FVC):\n  - Sensitivity: 100% recommended baseline evaluation.\n  - Must record daytime intake, voided volumes, wet nights, and morning volume over 48-72 hours." }
                ],
                "Stepwise Management Protocols": [
                    { q: "Stepwise Treatment Algorithms & Drug Doses", a: "• Step 1: Lifestyle Interventions:\n  - Adequate daytime hydration with fluid restriction 2 hours before bedtime.\n  - Mandatory double voiding before sleep.\n  - Stop evening caffeine, carbonated, and artificial drinks.\n  - Aggressively treat constipation.\n\n• Step 2: Enuresis Conditioning Alarm (First-line for MNE):\n  - Highest long-term curative rate (>60-70%).\n  - Requires child/parent motivation; sensor triggers waking upon initial moisture.\n  - Continue until 14 consecutive dry nights are achieved (usually 2-3 months).\n\n• Step 3: Pharmacotherapy (Desmopressin - DDAVP):\n  - Oral Lyophilisate (melt): 120 - 240 mcg PO at bedtime OR Tablets: 0.2 - 0.4 mg PO 1 hr before sleep.\n  - CRITICAL SAFETY PROTOCOL: Strictly limit fluid intake to ≤200 mL starting 1 hour before and until 8 hours post-dose to prevent water intoxication and fatal dilutional hyponatremia!" }
                ]
            }
        };

        const tabsContainer = document.getElementById('diseaseTabs');
        const formSection = document.getElementById('formSection');
        const phaseSelect = document.getElementById('phaseSelect');
        const scenarioDiv = document.getElementById('scenarioDiv');
        const scenarioSelect = document.getElementById('scenarioSelect');
        const resultCard = document.getElementById('resultCard');
        const resultContent = document.getElementById('resultContent');

        let currentDisease = '';
        let currentPhase = '';

        // Initialize Condition Tabs
        Object.keys(clinicalData).forEach(disease => {
            const btn = document.createElement('button');
            btn.className = 'px-4 py-2 bg-slate-100 text-slate-600 rounded-full text-xs font-bold hover:bg-sky-100 hover:text-sky-700 transition-colors border border-slate-200';
            btn.textContent = disease;
            btn.onclick = () => selectDisease(disease, btn);
            tabsContainer.appendChild(btn);
        });

        function selectDisease(disease, clickedBtn) {
            currentDisease = disease;
            
            Array.from(tabsContainer.children).forEach(b => {
                b.classList.remove('bg-sky-700', 'text-white', 'border-sky-800');
                b.classList.add('bg-slate-100', 'text-slate-600');
            });
            clickedBtn.classList.remove('bg-slate-100', 'text-slate-600');
            clickedBtn.classList.add('bg-sky-700', 'text-white', 'border-sky-800');

            formSection.classList.remove('hidden');
            scenarioDiv.classList.add('hidden');
            resultCard.classList.add('hidden');
            
            phaseSelect.innerHTML = '<option value="" disabled selected>Choose category or phase...</option>';
            Object.keys(clinicalData[disease]).forEach(phase => {
                const opt = document.createElement('option');
                opt.value = phase;
                opt.textContent = phase;
                phaseSelect.appendChild(opt);
            });
        }

        phaseSelect.addEventListener('change', (e) => {
            currentPhase = e.target.value;
            scenarioDiv.classList.remove('hidden');
            resultCard.classList.add('hidden');

            scenarioSelect.innerHTML = '<option value="" disabled selected>Choose specific topic...</option>';
            clinicalData[currentDisease][currentPhase].forEach((item, index) => {
                const opt = document.createElement('option');
                opt.value = index;
                opt.textContent = item.q;
                scenarioSelect.appendChild(opt);
            });
        });

        scenarioSelect.addEventListener('change', (e) => {
            const scenarioIndex = e.target.value;
            const data = clinicalData[currentDisease][currentPhase][scenarioIndex];
            
            resultContent.innerHTML = data.a.replace(/\n/g, '<br>');
            resultCard.classList.remove('hidden');
        });
    </script>
</body>
</html>
