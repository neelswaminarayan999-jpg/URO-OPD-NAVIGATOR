    <!-- Complete Clinical Database -->
    <script>
        const clinicalData = {
            "Ca Bladder": {
                "1. Diagnostic Workup & Biomarkers": [
                    { q: "Initial Hematuria & LUTS Workup Algorithm", a: "Initial Presentation Workup:\n• Gross Hematuria or persistent microscopic hematuria (>3 RBC/HPF), or persistent unexplained storage LUTS.\n• CT Urogram (Split-bolus triphasic): Mandatory to evaluate the entire upper urinary tract (renal pelvis, calyces, ureters).\n• Flexible Cystoscopy: In-office mucosal inspection under local anesthesia. Document lesion location, size, morphology (papillary vs sessile), and multifocality.\n• TURBT: Must resect superficial exophytic tumor and deep detrusor muscle separately to provide accurate T staging.\n• Staging CT C/A/P: Mandatory if TURBT demonstrates muscle-invasive disease (≥T2) or high-risk features." },
                    { q: "The Paris System 2.0 (TPS) for Urinary Cytology", a: "Paris System 2.0 Diagnostic Categories:\n• Unsatisfactory / Non-diagnostic: Low urothelial cellularity (<10 well-preserved urothelial cells) or obscuring inflammation/blood.\n• Negative for High-Grade Urothelial Carcinoma (NHGUC): Benign/reactive urothelial cells, degenerative umbrella cells.\n• Atypical Urothelial Cells (AUC): N:C ratio 0.5–0.7, mild nuclear hyperchromasia. Risk of Malignancy (ROM): 15%–30%.\n• Suspicious for High-Grade Urothelial Carcinoma (SHGUC): Markedly enlarged hyperchromatic nuclei, irregular chromatin, N:C ratio >0.7 but cellular quantity limited. ROM: 60%–80%.\n• High-Grade Urothelial Carcinoma (HGUC): N:C ratio ≥0.7, marked nuclear hyperchromasia, irregular nuclear membranes, coarse chromatin. ROM: >90%.\n• Low-Grade Urothelial Neoplasm (LGUN): Cohesive 3D papillary clusters with fibrovascular cores (rarely diagnosed accurately in voided urine)." },
                    { q: "Investigations: Sensitivity & Specificity", a: "Diagnostic Accuracy of Bladder Investigations:\n• Voided Urine Cytology:\n  - High-Grade / CIS: Sensitivity 80%–90%, Specificity >95%\n  - Low-Grade Ta: Sensitivity 15%–30%, Specificity >95% (poor sensitivity for low grade)\n• White Light Flexible Cystoscopy:\n  - Sensitivity: 85%–90%, Specificity: 80%–85% (can miss flat CIS or microscopic satellite tumors)\n• Photodynamic Diagnosis (PDD / Blue Light Hexvix):\n  - Sensitivity: 92%–96%, Specificity: 65%–75% (improves CIS detection by 20%–30%)\n• Narrow Band Imaging (NBI):\n  - Sensitivity: 94%–96%, Specificity: 73%–80%\n• CT Urogram:\n  - UTUC detection: Sensitivity 92%–96%, Specificity 94%–98%\n  - Bladder tumors: Sensitivity 85% (cannot replace cystoscopic inspection)\n• Multiparametric MRI Bladder (VI-RADS Score ≥3 for Muscle Invasion):\n  - Sensitivity: 88%–92%, Specificity: 85%–90%, Accuracy: ~90%" }
                ],
                "2. TNM Staging & Histological Grading": [
                    { q: "TNM Staging Definitions (AJCC 8th Edition)", a: "Primary Tumor (T):\n• Ta: Non-invasive papillary urothelial carcinoma\n• Tis: Urothelial carcinoma in situ (flat high-grade lesion)\n• T1: Tumor invades subepithelial connective tissue (lamina propria)\n• T2: Tumor invades muscularis propria (detrusor muscle)\n  - T2a: Invades superficial muscularis propria (inner half)\n  - T2b: Invades deep muscularis propria (outer half)\n• T3: Tumor invades perivesical tissue\n  - T3a: Microscopically | T3b: Macroscopically (extravesical mass)\n• T4: Tumor invades adjacent organs\n  - T4a: Invades prostatic stroma, seminal vesicles, uterus, or vagina\n  - T4b: Invades pelvic wall or abdominal wall\n\nRegional Lymph Nodes (N - True Pelvis below Aortic Bifurcation):\n• N0: No regional LN metastasis\n• N1: Single lymph node in true pelvis (hypogastric, obturator, external iliac, or presacral)\n• N2: Multiple regional lymph nodes in true pelvis\n• N3: Common iliac lymph node metastasis\n\nDistant Metastasis (M):\n• M0: No distant metastasis | M1a: Non-regional nodes (retroperitoneal/para-aortic) | M1b: Visceral/bone" },
                    { q: "Histological Grading: WHO 1973 vs WHO 2004/2016/2022", a: "Histological Grading Systems:\n• WHO 1973 System (Maintained for historical prognostic models):\n  - Grade 1: Well differentiated\n  - Grade 2: Moderately differentiated\n  - Grade 3: Poorly differentiated\n\n• WHO 2004/2016/2022 System:\n  - PUNLMP (Papillary Urothelial Neoplasm of Low Malignant Potential): Non-invasive, delicate papillae, minimal/absent nuclear atypia.\n  - Low-Grade (LG) Urothelial Carcinoma: Architectural preservation, slight nuclear size variation, rare mitoses.\n  - High-Grade (HG) Urothelial Carcinoma: Marked architectural disorder, pleomorphic hyperchromatic nuclei, frequent typical and atypical mitoses, high progression risk." }
                ],
                "3. NMIBC Risk & Instillation Management": [
                    { q: "Immediate Post-Op Single Instillation Chemotherapy", a: "Protocol:\n• Timing: Administer within 2–6 hours of TURBT (never exceed 24 hours).\n• Mechanism: Destroys circulating tumor cells and prevents reimplantation on resection bed.\n• Drug Regimens:\n  1. Mitomycin C: 40 mg dissolved in 40 mL saline (dwell time 1–2 hours).\n  2. Gemcitabine: 2,000 mg dissolved in 100 mL saline (dwell time 1 hour; lower chemical cystitis rate).\n• ABSOLUTE CONTRAINDICATIONS: Known or suspected intraperitoneal or extraperitoneal bladder perforation, extensive resection requiring deep cautery, or ongoing severe hematuria (risk of systemic extravasation and pelvic necrotizing fasciitis)." },
                    { q: "EAU Risk Group Stratification Matrix", a: "EAU Risk Stratification for NMIBC:\n• Low Risk: Primary, solitary, TaG1/PUNLMP, <3 cm, no CIS.\n• Intermediate Risk: Patients without high-grade recurrence who fall between low and high risk (e.g., multifocal TaG1, recurrence within 1 year, solitary TaG2 >3 cm).\n• High Risk: Any T1 lesion OR any High Grade / G3 lesion OR presence of CIS OR multiple recurrent large TaG1-G2.\n• Very High Risk: T1G3/HG associated with concurrent bladder CIS, multiple/large T1G3, T1G3 with lymphovascular invasion (LVI+), or variant histology (micropapillary, plasmacytoid, sarcomatoid)." },
                    { q: "Low Risk NMIBC Protocol & Surveillance", a: "Management Protocol:\n• TURBT + immediate single instillation chemotherapy only.\n• No adjuvant induction or maintenance intravesical therapy.\n• Surveillance Schedule:\n  - Cystoscopy at 3 months post-TURBT.\n  - If negative: Follow-up cystoscopy at 9 months, then annually for 5 years.\n  - Routine urine cytology is not indicated for pure low-risk disease." },
                    { q: "Intermediate Risk NMIBC Protocol", a: "Management Protocol:\n• Adjuvant Induction Therapy: 6 weekly instillations.\n• Agents: Intravesical BCG (full dose) OR Intravesical Chemotherapy (Mitomycin C 40 mg weekly x 6).\n• Maintenance Therapy: Recommended up to 1 year (e.g., 3 weekly instillations at 3, 6, and 12 months for BCG; or monthly instillation for chemotherapy).\n• Surveillance: Cystoscopy + urine cytology every 3–6 months for 2 years, then annually." },
                    { q: "High Risk NMIBC Protocol & BCG Maintenance Schedule", a: "Management Protocol:\n• Step 1: Mandatory Re-TURBT within 2–6 weeks.\n• Step 2: Adjuvant Induction BCG (weekly instillations for 6 weeks).\n• Step 3: 3-Year Maintenance BCG Schedule (SWOG Protocol):\n  - 3 weekly instillations given at 3, 6, 12, 18, 24, 30, and 36 months.\n• Alternative: Discuss upfront Radical Cystectomy if high risk of progression or if patient prefers definitive surgery." },
                    { q: "Very High Risk NMIBC Protocol", a: "Management Protocol:\n• Primary Recommendation: Upfront Radical Cystectomy with Extended Pelvic Lymph Node Dissection (ePLND).\n• Rationale: Progression to muscle invasion exceeds 40%–50% within 3 years on conservative intravesical therapy.\n• Alternative: In patients unfit or refusing RC: Full-dose BCG induction + full 3-year maintenance (close surveillance with early salvage cystectomy at first sign of recurrence)." },
                    { q: "Indications for Mandatory Re-TURBT", a: "Mandatory Indications for Re-TURBT within 2–6 weeks:\n1. Initial resection was incomplete or fragmented.\n2. Specimen lacks detrusor muscle (muscularis propria absent, except in primary CIS or solitary TaLG).\n3. Any T1 tumor (highest risk of occult muscle invasion).\n4. All High-Grade / G3 lesions (regardless of stage).\n5. Any clinical suspicion of muscle-invasive disease." },
                    { q: "Chances & Predictors of Upstaging in Re-TURBT", a: "Upstaging Statistics & Prognostic Factors:\n• Overall Upstaging to Muscle-Invasive Disease (≥T2): 10%–15% across all cohorts.\n• If Detrusor Muscle was ABSENT in initial T1 specimen: Upstaging to ≥T2 rises to 30%–40%!\n• Residual Tumor at Re-TURBT: Found in 50%–70% of high-grade resections.\n• Primary Predictors of Upstaging: Initial T1 stage, high-grade histology, solid/sessile tumor architecture, presence of CIS, lack of muscularis propria, and tumor size >3 cm." }
                ],
                "4. MIBC & Muscle-Invasive Local Therapy": [
                    { q: "Cisplatin Eligibility Criteria (Galsky Criteria)", a: "Patient must meet ALL of the following criteria to receive Cisplatin-based chemotherapy:\n1. Creatinine Clearance / eGFR > 60 mL/min (borderline: 50–60 mL/min may receive split-dose cisplatin).\n2. ECOG Performance Status 0 or 1.\n3. Absence of Grade ≥2 peripheral neuropathy.\n4. Absence of Grade ≥2 audiometric hearing loss.\n5. Absence of NYHA Class III or IV congestive heart failure.\n• Carboplatin is NOT an acceptable substitute for Cisplatin in curative neoadjuvant therapy!" },
                    { q: "Neoadjuvant ddMVAC Chemotherapy Regimen", a: "ddMVAC Protocol (Dose-Dense MVAC):\n• Methotrexate: 30 mg/m² IV (Day 1)\n• Vinblastine: 3 mg/m² IV (Day 2)\n• Doxorubicin: 30 mg/m² IV (Day 2)\n• Cisplatin: 70 mg/m² IV (Day 2)\n• G-CSF / Pegfilgrastim: Administered subcutaneously 24–48 hours post-chemo.\n• Cycle Schedule: Every 14 days for 4 cycles.\n• Surgery: Proceed to Radical Cystectomy within 4–8 weeks after completion of cycle 4." },
                    { q: "Perioperative Durvalumab Protocol (NIAGARA Regimen)", a: "NIAGARA Regimen Protocol:\n• Neoadjuvant Phase (Every 3 weeks x 4 cycles):\n  1. Durvalumab: 1,500 mg IV (Day 1)\n  2. Gemcitabine: 1,000 mg/m² IV (Days 1 and 8)\n  3. Cisplatin: 70 mg/m² IV (Day 1)\n• Definitive Local Surgery:\n  - Radical Cystectomy + Extended Pelvic LND.\n• Adjuvant Maintenance Phase (Every 4 weeks x up to 8 cycles):\n  1. Durvalumab: 1,500 mg IV monotherapy maintenance.\n  *(Weight <30 kg: 20 mg/kg weight-based dosing)*" },
                    { q: "Extended Pelvic LND (ePLND Boundaries for RC)", a: "Dissection Boundaries for Extended PLND:\n• Cranial Boundary: Aortic bifurcation / common iliac vessel bifurcation (including common iliac and presacral nodes).\n• Lateral Boundary: Genitofemoral nerve and psoas muscle.\n• Medial Boundary: Internal iliac (hypogastric) vessels and bladder wall.\n• Caudal Boundary: Node of Cloquet and inguinal ligament.\n• Dorsal / Floor: Obturator fossa and obturator nerve.\n• Nodal Yield Benchmark: Minimum 15–20 lymph nodes examined for adequate pathologic staging." },
                    { q: "Trimodal Bladder Preservation Therapy (TMT)", a: "TMT Protocol:\n• Step 1: Maximal, complete TURBT (visible tumor must be completely resected).\n• Step 2: Concurrent Chemo-Radiotherapy:\n  - Radiation Dose: 55–64 Gy delivered to bladder with pelvic nodal coverage.\n  - Radiosensitizing Chemotherapy: Cisplatin (weekly), OR 5-FU + Mitomycin C, OR Gemcitabine.\n• Step 3: Mid-treatment / Post-treatment Cystoscopy:\n  - If complete response: Complete RT course + strict surveillance.\n  - If persistent / recurrent invasive disease: Prompt Salvage Radical Cystectomy." }
                ],
                "5. Advanced & Metastatic Disease": [
                    { q: "First-Line Cisplatin-Eligible & Avelumab Maintenance", a: "Protocol:\n• Induction: Gemcitabine (1,000 mg/m² D1, 8) + Cisplatin (70 mg/m² D1) q3w for 4–6 cycles OR ddMVAC x 4–6 cycles.\n• Switch Maintenance:\n  - Eligibility: Patients with non-progressive disease (CR, PR, or SD) following induction.\n  - Regimen: Avelumab (800 mg IV every 2 weeks) + best supportive care until progression." },
                    { q: "First-Line Cisplatin-Ineligible (EV + Pembrolizumab)", a: "Protocol:\n• Enfortumab Vedotin (EV): 1.25 mg/kg IV (Days 1 and 8 of 21-day cycle; max dose 125 mg).\n• Pembrolizumab: 200 mg IV every 3 weeks (or 400 mg every 6 weeks).\n• Alternative if EV unavailable: Gemcitabine + Carboplatin (AUC 4.5–5) x 4–6 cycles." },
                    { q: "Targeted Therapy: Erdafitinib for FGFR Alterations", a: "Erdafitinib Protocol:\n• Indication: Locally advanced or metastatic urothelial carcinoma progressing during/following platinum chemotherapy with susceptible FGFR3 or FGFR2 genetic alterations.\n• Dosing: Initial 8 mg PO once daily. Uptitrate to 9 mg once daily at Day 14–21 if serum phosphate is <5.5 mg/dL and no treatment-related toxicities occur.\n• Toxicity Monitoring: Baseline and monthly ophthalmology exams (central serous retinopathy risk) and serum phosphate monitoring." }
                ],
                "6. Follow-Up & Surveillance": [
                    { q: "NMIBC Surveillance Schedule", a: "Schedule:\n• Low Risk: Cystoscopy at 3 and 9 months, then annually for 5 years.\n• Intermediate / High Risk:\n  - Cystoscopy + Urine Cytology every 3 months for 2 years.\n  - Every 6 months for years 3–5.\n  - Annually thereafter.\n  - Upper tract CT Urogram every 12–24 months." },
                    { q: "MIBC Post-Cystectomy Surveillance Schedule", a: "Schedule:\n• CT Chest/Abdomen/Pelvis, renal function, and CBC every 3–6 months for 2 years, then every 6–12 months for years 3–5, then annually.\n• Urinary Diversion Metabolic Monitoring (if ileal segment used):\n  - Serum electrolytes, bicarbonate, arterial/venous blood gas (hyperchloremic metabolic acidosis).\n  - Annual Vitamin B12 levels starting at year 2 post-op.\n• Urethral wash cytology every 6–12 months if native urethra was preserved." }
                ]
            },
            "Ca Prostate": {
                "1. Diagnostic Workup & Investigations": [
                    { q: "Elevated PSA & Abnormal DRE Workup", a: "Diagnostic Evaluation:\n• Repeat PSA measurement in 2–4 weeks under standardized conditions (rule out UTI, urinary retention, recent ejaculation, or vigorous cycling).\n• Digital Rectal Examination (DRE): Palpation of nodularity, induration, asymmetry, or loss of lateral sulci.\n• Pre-biopsy mpMRI Prostate (PI-RADS v2.1): Mandatory standard of care before performing prostate biopsy." },
                    { q: "PSA Density, Free/Total Ratio & Biomarkers", a: "Diagnostic Metrics:\n• PSA Density (PSAD): Total PSA / Prostate Volume (cc) measured by MRI or TRUS.\n  - Cut-off ≥0.15 ng/mL/cc: Strongly indicates clinically significant prostate cancer (csPCa).\n• Free-to-Total PSA Ratio (%fPSA):\n  - Indication: Total PSA in 4–10 ng/mL range with negative DRE.\n  - %fPSA <10%: 56% cancer probability | %fPSA >25%: <8% cancer probability." },
                    { q: "Investigations: Sensitivity & Specificity", a: "Diagnostic Accuracy of Prostate Tests:\n• Serum Total PSA (at 4.0 ng/mL cut-off):\n  - Sensitivity: 70%–80%, Specificity: 30%–40% (high false positive rate from BPH/prostatitis)\n• Digital Rectal Examination (DRE):\n  - Sensitivity: 50%–60%, Specificity: 80%–90%\n• Multiparametric MRI (PI-RADS v2.1 score ≥3 for csPCa):\n  - Sensitivity: 85%–92%, Specificity: 75%–85%, NPV: 88%–95%\n• Biopsy Strategy Accuracy:\n  - Combined Targeted + Systematic Biopsy: Sensitivity >95% for csPCa\n  - Systematic 12-core TRUS Biopsy alone: Misses 20%–30% of significant anterior/apical cancers\n• 68Ga-PSMA-11 PET-CT:\n  - Initial Nodal Staging: Sensitivity 40%–55% (limited for micromets <4 mm), Specificity 95%–98%\n  - Restaging at Biochemical Recurrence: PSA 0.2–0.5: 38%–50% | PSA 0.5–1.0: 55%–70% | PSA 1.0–2.0: 75%–85% | PSA >2.0: >90% detection" }
                ],
                "2. TNM Staging & ISUP Grading": [
                    { q: "AJCC 8th Edition TNM Staging", a: "Clinical Primary Tumor (cT):\n• T1: Clinically inapparent (not palpable/visible)\n  - T1a: ≤5% of resected tissue | T1b: >5% of resected tissue | T1c: Needle biopsy finding (elevated PSA)\n• T2: Confined within prostate\n  - T2a: ≤ half of one lobe | T2b: > half of one lobe | T2c: Involves both lobes\n• T3: Extraprostatic extension\n  - T3a: Extracapsular extension | T3b: Seminal vesicle invasion\n• T4: Fixed or invades adjacent structures (rectum, bladder neck, sphincter, levator muscles, pelvic wall)\n\nRegional Lymph Nodes (N - True Pelvis below Aortic Bifurcation):\n• N0: No regional LN metastasis | N1: Regional nodal metastasis\n\nDistant Metastasis (M):\n• M0: No distant metastasis | M1a: Non-regional nodes | M1b: Bone | M1c: Other distant organs" },
                    { q: "ISUP Grade Groups (1-5) & Gleason Architecture", a: "Grade Groups & Gleason Scores:\n• Grade Group 1 (Gleason 3+3 = 6): Only individual, discrete, well-formed glands. No fused or cribriform patterns.\n• Grade Group 2 (Gleason 3+4 = 7): Predominantly well-formed glands with lesser component of poorly formed/cribriform glands (<50%).\n• Grade Group 3 (Gleason 4+3 = 7): Predominantly poorly formed/fused/cribriform glands (>50%) with lesser component of well-formed glands.\n• Grade Group 4 (Gleason 8): Only poorly formed/fused/cribriform glands (4+4), OR Gleason 3+5, OR Gleason 5+3.\n• Grade Group 5 (Gleason 9–10): Lack of gland formation, solid sheets, cords, single cells, or presence of comedonecrosis." }
                ],
                "3. Risk Stratification & Localized Management": [
                    { q: "NCCN / EAU Risk Stratification Matrix", a: "Risk Categorization:\n• Very Low: T1c, GG1, PSA <10, <3 positive cores, ≤50% cancer/core, PSAD <0.15.\n• Low: T1–T2a, GG1, PSA <10.\n• Intermediate Favorable: 1 intermediate factor (T2b–c OR GG2 OR PSA 10–20), GG 1–2, <50% positive cores.\n• Intermediate Unfavorable: GG 3 OR ≥50% positive cores OR multiple intermediate factors.\n• High: T3a OR GG 4–5 OR PSA >20.\n• Very High: T3b–T4, primary Gleason pattern 5, or >4 cores of GG 4–5." },
                    { q: "Active Surveillance Protocol (Low & Very Low Risk)", a: "Active Surveillance (Standard of Care):\n• PSA every 6 months.\n• Clinical DRE annually.\n• Repeat mpMRI at 12–18 months.\n• Confirmatory prostate biopsy within 12–24 months (or earlier if PSA velocity increases or MRI progresses).\n• Triggers for Curative Intervention: Upgrading to Grade Group ≥2, significant tumor volume increase, or patient preference." },
                    { q: "Intermediate Risk Protocols (Favorable vs Unfavorable)", a: "Management Protocol:\n• Favorable Intermediate: Active Surveillance (highly selected GG2), Radical Prostatectomy (RP) alone, or External Beam Radiotherapy (EBRT 78 Gy) alone.\n• Unfavorable Intermediate: Radical Prostatectomy + Extended PLND OR EBRT (78 Gy) + short-course (4–6 months) Androgen Deprivation Therapy (ADT)." },
                    { q: "High & Very High Risk Protocols", a: "Management Protocol:\n• Surgical Approach: Radical Prostatectomy + mandatory Extended Pelvic LND (ePLND).\n• Radiation Approach: EBRT (78–80 Gy) + long-course ADT (18–36 months) ± Brachytherapy boost." }
                ],
                "4. Lymph Node Management & Boundaries": [
                    { q: "Extended Pelvic LND Boundaries (CaP Template)", a: "Dissection Template for Prostate Cancer:\n• Trigger: Pre-op nomogram risk of nodal metastasis >5% (Briganti or MSKCC).\n• Cranial: Aortic bifurcation and bifurcation of common iliac vessels.\n• Lateral: Genitofemoral nerve and psoas muscle.\n• Medial: Internal iliac (hypogastric) vessels.\n• Distal: Node of Cloquet and femoral ring.\n• Dorsal / Floor: Obturator nerve and vessels." },
                    { q: "Pathological Node-Positive (pN1) Management", a: "Protocol:\n• Adjuvant continuous Androgen Deprivation Therapy (LHRH agonist/antagonist) ± Adjuvant Pelvic External Beam Radiotherapy (50.4 Gy with nodal boost)." }
                ],
                "5. Advanced & Metastatic Disease": [
                    { q: "mHSPC Triplet Therapy & Doublet Protocols", a: "Systemic Backbone: Continuous ADT (surgical or medical castration to testosterone <50 ng/dL).\n• Triplet Therapy (High Volume by CHAARTED criteria):\n  - ADT + Docetaxel (75 mg/m² q3w x 6 cycles) + Darolutamide (600 mg PO BID) OR Abiraterone acetate (1,000 mg PO daily + Prednisone 5 mg daily).\n• Doublet Therapy:\n  - ADT + ARPI (Enzalutamide 160 mg daily, Apalutamide 240 mg daily, or Abiraterone)." },
                    { q: "mCRPC Targeted & Chemotherapy Protocols", a: "Protocol (Maintain castrate state):\n• PARP Inhibitors: Olaparib (300 mg PO BID) for deleterious BRCA1, BRCA2, or ATM homologous recombination repair mutations.\n• Radioligand Therapy: Lutetium-177 PSMA-617 (7.4 GBq IV every 6 weeks for up to 6 cycles) in PSMA-positive mCRPC post-ARPI and post-Docetaxel.\n• Taxane Chemotherapy: Docetaxel (75 mg/m² q3w) OR Cabazitaxel (20–25 mg/m² q3w + G-CSF)." }
                ],
                "6. Follow-Up & Biochemical Recurrence (BCR)": [
                    { q: "Post-Treatment Surveillance Schedule", a: "Surveillance:\n• PSA every 3–6 months for 3 years, then every 6 months for years 4–5, then annually.\n• DRE annually (in irradiated patients or if local recurrence is suspected post-RP)." },
                    { q: "Biochemical Recurrence (BCR) Definitions & Action", a: "BCR Criteria:\n• Post-Radical Prostatectomy: PSA ≥ 0.2 ng/mL confirmed on two consecutive measurements 2–4 weeks apart.\n• Post-Radiotherapy (Phoenix Criteria): PSA rise of ≥ 2.0 ng/mL above post-treatment nadir.\n• Restaging & Action: 68Ga-PSMA-11 PET-CT. If no distant metastases: Salvage RT to prostatic bed (64–70 Gy) ± short-term ADT." }
                ]
            },
            "Ca Penis": {
                "1. Diagnostic Workup & Investigations": [
                    { q: "Biopsy & Initial Evaluation", a: "Workup Protocol:\n• Histological confirmation via punch, incisional, or excisional biopsy.\n• Assessment of depth of invasion, histologic subtype, grade, and lymphovascular invasion (LVI).\n• Bilateral physical examination and high-resolution ultrasound of inguinal groins." },
                    { q: "Investigations: Sensitivity & Specificity", a: "Diagnostic Accuracy of Penile Cancer Tests:\n• Groin Physical Palpation: Sensitivity ~70%–80%, Specificity ~50% (50% of palpable nodes are inflammatory/reactive hyperplasia)\n• High-Resolution USG + FNAC: Sensitivity 85%–95%, Specificity 95%–100% in palpable nodes; misses occult micrometastases in cN0 (<2 mm)\n• Dynamic Sentinel Node Biopsy (DSNB) with 99mTc-nanocolloid + Patent Blue: In cN0 intermediate/high risk: Sensitivity 88%–95%, Specificity 100%, False-negative rate 5%–10%\n• CT Pelvis / Abdomen: Sensitivity 60%–70%, Specificity 90%–95% for enlarged pelvic nodes (>1 cm); poor for cN0 normal-sized nodes\n• 18F-FDG PET-CT: Sensitivity 85%–90%, Specificity 88%–92% for pelvic nodal and distant metastatic detection" }
                ],
                "2. TNM Staging & Histological Grading": [
                    { q: "AJCC 8th Edition TNM Staging", a: "Primary Tumor (T):\n• Tis: Carcinoma in situ (PeIN) | Ta: Non-invasive verrucous carcinoma\n• T1: Invades subepithelial connective tissue\n  - T1a: LVI negative and well/moderately differentiated (G1–G2)\n  - T1b: LVI positive OR poorly differentiated/undifferentiated (G3)\n• T2: Invades corpus spongiosum with/without urethral invasion\n• T3: Invades corpus cavernosum with/without urethral invasion\n• T4: Invades adjacent structures (scrotum, prostate, pubic bone)\n\nRegional Lymph Nodes (cN vs pN):\n• cN0: No palpable inguinal nodes | cN1: Palpable mobile solitary unilateral node | cN2: Palpable mobile multiple or bilateral nodes | cN3: Palpable fixed nodal mass or pelvic lymphadenopathy\n• pN1: ≤2 unilateral nodes (ENE-) | pN2: ≥3 unilateral or bilateral nodes (ENE-) | pN3: Extranodal extension (ENE+) OR any pelvic node metastasis" },
                    { q: "WHO Histological Grading", a: "Grading Criteria:\n• Grade 1 (Well differentiated): Papillary or nested growth, abundant keratin pearls, intercellular bridges, minimal pleomorphism, rare mitoses.\n• Grade 2 (Moderately differentiated): Distinct nuclear pleomorphism, less prominent keratinization, higher mitotic activity.\n• Grade 3 (Poorly differentiated / Undifferentiated): Marked cellular pleomorphism, solid sheets, absence of keratinization, frequent atypical mitoses. Occult nodal metastases risk exceeds 35% in cN0." }
                ],
                "3. Primary Tumor Management": [
                    { q: "Penile-Sparing Surgical Modalities (Tis, Ta, T1aLG)", a: "Conservative Modalities:\n• Tis (PeIN): Topical 5-Fluorouracil (5-FU 5%) cream or Imiquimod 5% cream for 4–6 weeks.\n• Ta / T1aLG: Wide local excision with 3–5 mm clear surgical margins, CO2/Nd:YAG laser ablation, or Glansectomy with split-thickness skin graft reconstruction.\n• Goal: Preservation of cosmetic appearance, normal upright micturition, and erectile function." },
                    { q: "Invasive Primary Tumors (Partial vs Total Penectomy)", a: "Surgical Plans:\n• Partial Penectomy: Indicated for T1b, T2, and selected T3 tumors where a 2–3 cm functional penile stump can be preserved with 3–5 mm negative margins.\n• Total Penectomy with Perineal Urethrostomy: Indicated for large T3, T4, or proximal shaft tumors where adequate surgical margins preclude preserving a functional stump." }
                ],
                "4. Inguinal & Pelvic Lymph Node Management": [
                    { q: "Clinically N0 Groins: Stratification & DSNB", a: "Management Protocol:\n• Low Risk (Tis, Ta, T1aLG, LVI-): Clinical surveillance (palpation and USG every 3 months for 2 years).\n• Intermediate & High Risk (≥T1b, G3, or LVI+): Invasive nodal staging is MANDATORY (occult metastasis risk >20%). Perform Dynamic Sentinel Node Biopsy (DSNB) OR Modified Inguinal LND. Surveillance is contraindicated!" },
                    { q: "Clinically N1/N2 Groins: Radical Inguinal LND", a: "Surgical Template:\n• Perform Radical Inguinal Lymph Node Dissection (superficial and deep femoral nodal packets below fascia lata in femoral triangle).\n• Contralateral groin: Perform modified or radical ILND if ipsilateral specimen reveals >1 positive lymph node." },
                    { q: "Indications for Pelvic LND (PLND)", a: "Mandatory Indications for Ipsilateral Pelvic LND:\n1. Presence of ≥2 positive inguinal lymph nodes.\n2. Presence of Extranodal Extension (ENE+) in any inguinal node." }
                ],
                "5. Advanced & Metastatic Disease": [
                    { q: "Fixed Inguinal Mass (cN3): Neoadjuvant TIP Regimen", a: "TIP Chemotherapy Protocol:\n• Paclitaxel: 175 mg/m² IV (Day 1)\n• Ifosfamide: 1,200 mg/m² IV (Days 1–3) with Mesna uroprotection\n• Cisplatin: 25 mg/m² IV (Days 1–3)\n• Schedule: Every 21 days for 3–4 cycles, followed by consolidative Radical Inguinal + Pelvic LND if tumors become resectable." }
                ],
                "6. Follow-Up & Surveillance": [
                    { q: "Penile Cancer Follow-Up Schedule", a: "Surveillance Protocol:\n• Years 1–2: Strict physical exam of penis and groins every 3 months (80% of recurrences occur within 24 months).\n• Years 3–5: Clinical exam every 6 months.\n• Ultrasound of groins every 3–6 months in patients managed with surveillance or penile-sparing surgery." }
                ]
            },
            "Ca Testis": {
                "1. Diagnostic Workup & Tumor Markers": [
                    { q: "Scrotal Doppler USG & Pre-Orchiectomy Markers", a: "Diagnostic Evaluation:\n• High-frequency scrotal Doppler ultrasound: Document intra-testicular vs extra-testicular mass and vascularity.\n• Serum Tumor Markers (Mandatory BEFORE orchiectomy):\n  1. Alpha-Fetoprotein (AFP): Serum half-life 5–7 days.\n  2. Beta-Human Chorionic Gonadotropin (beta-hCG): Serum half-life 24–36 hours.\n  3. Lactate Dehydrogenase (LDH): Reflects total tumor burden and turnover rate." },
                    { q: "Radical Inguinal Orchiectomy Surgical Rules", a: "Mandatory Surgical Principles:\n• Inguinal incision above inguinal ligament; open external oblique aponeurosis.\n• Early cross-clamping of the spermatic cord at the internal inguinal ring prior to testicular mobilization to prevent intraoperative hematogenous tumor dissemination.\n• SCROTAL VIOLATION OR TRANS-SCROTAL BIOPSY IS STRICTLY CONTRAINDICATED (disrupts lymphatic drainage and leads to aberrant local/inguinal recurrences)." },
                    { q: "Investigations: Sensitivity & Specificity", a: "Diagnostic Accuracy of Testicular Cancer Tests:\n• Scrotal Doppler Ultrasound: Sensitivity 98%–100%, Specificity 95%–98% for intra-testicular neoplasm\n• Serum Tumor Markers: Pure Seminoma has 0% AFP elevation (AFP is never elevated; if positive, treat as NSGCT); hCG elevated in 15%–30%. NSGCT has marker elevation in 60%–80%\n• CT Abdomen/Pelvis: Sensitivity 70%–80%, Specificity 75%–85% for retroperitoneal lymph nodes (misses 20%–30% occult micrometastases in cN0)\n• 18F-FDG PET-CT:\n  - Seminoma Post-Chemo Residual Mass (≥3 cm): Sensitivity 80%–90%, Specificity 90%–95%, NPV 95%–98% (perform ≥6–8 weeks post-chemo)\n  - NSGCT: CONTRAINDICATED / Unreliable (mature teratoma is not FDG-avid)" }
                ],
                "2. TNM Staging & IGCCCG Classification": [
                    { q: "AJCC 8th Edition pTNM & S Staging", a: "Pathologic Primary Tumor (pT):\n• pTis: Germ cell neoplasia in situ (GCNIS)\n• pT1: Limited to testis/epididymis without vascular/lymphatic invasion (LVI-)\n• pT2: Limited to testis/epididymis WITH LVI+ OR invades tunica vaginalis\n• pT3: Invades spermatic cord | pT4: Invades scrotum\n\nRegional Nodes (N):\n• N1: Mass ≤2 cm OR ≤5 positive nodes | N2: Mass >2 cm to ≤5 cm OR >5 positive nodes OR ENE+ | N3: Mass >5 cm\n\nSerum Tumor Markers (S - Post-Orchiectomy Nadir):\n• S0: Normal | S1: LDH <1.5x ULN AND hCG <5,000 mIU/mL AND AFP <1,000 ng/mL | S2: LDH 1.5–10x ULN OR hCG 5,000–50,000 OR AFP 1,000–10,000 | S3: LDH >10x ULN OR hCG >50,000 OR AFP >10,000" },
                    { q: "IGCCCG Prognostic Risk Categorization", a: "IGCCCG Risk Stratification:\n• Good Risk:\n  - Seminoma: Any primary site, no non-pulmonary visceral mets, normal AFP, any hCG/LDH. (5-yr OS 95%)\n  - NSGCT: Testicular/retroperitoneal primary, no non-pulmonary visceral mets, S1 markers. (5-yr OS 90%)\n• Intermediate Risk:\n  - Seminoma: Non-pulmonary visceral mets, normal AFP, any hCG/LDH. (5-yr OS 88%)\n  - NSGCT: Testicular/retroperitoneal primary, no non-pulmonary visceral mets, S2 markers. (5-yr OS 80%)\n• Poor Risk (NSGCT only):\n  - Mediastinal primary site, OR non-pulmonary visceral metastases, OR S3 markers. (5-yr OS 50%–60%)" }
                ],
                "3. Stage I Management": [
                    { q: "Stage I Seminoma Management", a: "Options:\n• Surveillance (Preferred): Serial physical exams, tumor markers, and abdominal CT scans.\n• Adjuvant Chemotherapy: Single-dose Carboplatin (AUC 7) x 1–2 cycles (indicated if tumor >4 cm or rete testis invasion).\n• Adjuvant Radiotherapy: Rarely used today due to secondary malignancy risks." },
                    { q: "Stage I NSGCT Management (LVI- vs LVI+)", a: "Options:\n• Low Risk (LVI negative): Active Surveillance preferred (relapse rate ~15%; 99% overall survival with salvage).\n• High Risk (LVI positive): Primary Nerve-Sparing RPLND OR 1 cycle of adjuvant BEP chemotherapy (reduces relapse rate to <3%)." }
                ],
                "4. Advanced Disease & Chemotherapy Regimens": [
                    { q: "BEP, EP & VIP Chemotherapy Regimens", a: "Regimens:\n• BEP Regimen:\n  - Bleomycin: 30,000 IU IV (Days 1, 8, and 15)\n  - Etoposide: 100 mg/m² IV (Days 1–5)\n  - Cisplatin: 20 mg/m² IV (Days 1–5)\n  - Schedule: Good Risk = 3 cycles of BEP OR 4 cycles of EP | Intermediate/Poor Risk = 4 cycles of BEP.\n• VIP Regimen (Used when Bleomycin is contraindicated due to underlying pulmonary compromise):\n  - Etoposide 75 mg/m² (D1–5) + Ifosfamide 1,200 mg/m² (D1–5 with Mesna) + Cisplatin 20 mg/m² (D1–5) x 4 cycles." }
                ],
                "5. Post-Chemotherapy Residual Mass Management": [
                    { q: "Seminoma Residual Mass Algorithm", a: "Protocol:\n• Residual mass < 3 cm: Active surveillance.\n• Residual mass ≥ 3 cm: 18F-FDG PET-CT scan performed at least 6–8 weeks post-chemo.\n  - PET-Negative: Surveillance.\n  - PET-Positive: Surgical resection or biopsy." },
                    { q: "NSGCT Residual Mass Algorithm", a: "Protocol:\n• Residual mass ≤ 1 cm and normalized markers: Active surveillance.\n• Residual mass > 1 cm and normalized markers: Mandatory Nerve-Sparing Retroperitoneal Lymph Node Dissection (RPLND).\n• Histology of Resected Mass: 50% teratoma, 35% fibrosis/necrosis, 15% viable germ cell cancer." }
                ],
                "6. Follow-Up & Long-Term Survivorship": [
                    { q: "Surveillance Schedule & Survivorship Care", a: "Surveillance:\n• Year 1: H&P and tumor markers every 2 months; CT Abdomen/Pelvis every 3–4 months; CXR every 2 months.\n• Year 2: H&P and markers every 3 months; CT A/P every 6 months.\n• Years 3–5: Clinic visits every 6 months; transition to annual checkups.\n• Survivorship: Minimize ionizing CT scans after year 3 to reduce secondary radiation-induced malignancies. Screen for metabolic syndrome, cardiovascular disease, and hypogonadism." }
                ]
            },
            "BPH": {
                "1. Diagnostic Evaluation & Metrics": [
                    { q: "IPSS & Quality of Life (QoL) Classification", a: "International Prostate Symptom Score (IPSS - Total 35 points):\n• Mild Symptoms: Score 0–7 (watchful waiting candidate)\n• Moderate Symptoms: Score 8–19 (medical therapy threshold)\n• Severe Symptoms: Score 20–35 (combination therapy or surgical evaluation)\n\nQuality of Life Bother Score (0–6):\n• 0: Delighted | 1: Pleased | 2: Mostly Satisfied | 3: Mixed | 4: Mostly Dissatisfied | 5: Unhappy | 6: Terrible" },
                    { q: "Diagnostic Accuracy of BPH Investigations", a: "Diagnostic Accuracy:\n• Uroflowmetry (Qmax):\n  - Qmax <10 mL/s: Specificity 85%–90% for bladder outlet obstruction (BOO); Sensitivity 60%–70% (cannot differentiate obstruction from detrusor underactivity without urodynamics)\n  - Qmax >15 mL/s: Obstruction unlikely\n  - Minimum voided volume: ≥150 mL required for valid test\n• Post-Void Residual (PVR) Ultrasound:\n  - Sensitivity 90%–95%, Specificity 95% compared to catheterization\n  - PVR >100–200 mL indicates higher risk of retention and medical treatment failure\n• Digital Rectal Examination (DRE) for Prostate Volume:\n  - Underestimates volume by 25%–35% in glands >40 cc compared to ultrasound/MRI" },
                    { q: "Indications for Urodynamic Studies (Pressure-Flow)", a: "Mandatory Indications for Pressure-Flow Urodynamics (PFS):\n1. Diagnostic uncertainty between BOO and detrusor underactivity / neurogenic bladder.\n2. Inconclusive uroflowmetry with normal Qmax (>15 mL/s) despite severe lower urinary tract symptoms.\n3. Prior failed invasive prostate surgery.\n4. Consideration of surgery in young men (<50 years) or elderly men (>80 years).\n5. Significant post-void residual (>300 mL)." }
                ],
                "2. Medical Therapy Protocols": [
                    { q: "Watchful Waiting & Behavioral Modifications", a: "Protocol:\n• Indicated for mild symptoms (IPSS <8) or moderate symptoms without significant bother.\n• Behavioral interventions: Fluid restriction 2–3 hours before bedtime, reduction of caffeine/alcohol, timed voiding, double voiding, and medication review (avoid decongestants/antihistamines)." },
                    { q: "Alpha-1 Blockers (Tamsulosin, Alfuzosin, Silodosin)", a: "Drug Regimens:\n• Tamsulosin: 0.4 mg PO once daily (rapid relief within 48–72 hours).\n• Alfuzosin: 10 mg PO once daily (low incidence of ejaculatory dysfunction).\n• Silodosin: 8 mg PO once daily (highest alpha-1A selectivity; causes retrograde ejaculation in ~25%–30%)." },
                    { q: "5-Alpha Reductase Inhibitors (5-ARIs & 50% PSA Rule)", a: "Drug Regimens:\n• Finasteride: 5 mg PO daily | Dutasteride: 0.5 mg PO daily.\n• Indication: Prostate volume >30–40 mL; reduces prostate size by 20%–25% and reduces risk of acute urinary retention and surgery.\n• 50% PSA RULE: 5-ARIs reduce serum PSA by approximately 50% after 6 months. To evaluate prostate cancer risk, MULTIPLY MEASURED PSA BY 2!" },
                    { q: "Combination Medical Therapy (CombAT Protocol)", a: "Protocol:\n• Regimen: Alpha-blocker + 5-ARI (e.g., Tamsulosin 0.4 mg + Dutasteride 0.5 mg daily).\n• Indications: Moderate to severe symptoms in men with prostate volume >30–40 mL and PSA >1.5 ng/mL. Significantly superior to either monotherapy in preventing disease progression." }
                ],
                "3. Surgical Decision Pathway": [
                    { q: "Absolute & Relative Indications for Surgery", a: "Indications for Surgery:\n• Absolute Indications: Refractory urinary retention (failed trial without catheter), recurrent gross hematuria secondary to BPH, recurrent UTIs, bladder calculi, and bilateral hydronephrosis or renal impairment caused by BOO.\n• Relative Indications: Intolerable symptoms or failure of medical therapy." },
                    { q: "Surgical Choice by Prostate Volume (<80 cc vs >80 cc)", a: "Surgical Modalities:\n• Prostate Volume < 80 cc: Monopolar or Bipolar Transurethral Resection of Prostate (TURP), Transurethral Incision of Prostate (TUIP for <30 cc), or ThuLEP/HoLEP.\n• Prostate Volume > 80 cc: Holmium Laser Enucleation of the Prostate (HoLEP) or Simple Prostatectomy (Open, Laparoscopic, or Robotic-Assisted).\n• Minimally Invasive Surgical Therapies (MIST): Prostatic Urethral Lift (UroLift) or Water Vapor Therapy (Rezum)." }
                ]
            },
            "Nocturnal Enuresis": {
                "1. Diagnostic Classification & Workup": [
                    { q: "MNE vs NMNE & Primary vs Secondary Classification", a: "Classification:\n• Monosymptomatic Nocturnal Enuresis (MNE): Involuntary voiding during sleep in children ≥5 years without daytime lower urinary tract symptoms.\n• Non-Monosymptomatic (NMNE): Bedwetting associated with daytime symptoms (urgency, frequency, holding maneuvers, daytime incontinence). Must evaluate daytime bladder function first!\n• Primary: Child has never been dry for a continuous period of at least 6 months.\n• Secondary: Enuresis developing after a dry period of at least 6 months (screen for psychosocial stressors, constipation, diabetes mellitus, diabetes insipidus, OSA, UTI)." },
                    { q: "Diagnostic Calculations: Expected Bladder Capacity & NPI", a: "Diagnostic Calculations:\n• Expected Bladder Capacity (EBC - Koff's Formula for ages 4–12):\n  - EBC (mL) = [Age in years + 1] x 30 mL\n• Nocturnal Polyuria Index (NPI):\n  - Nocturnal Polyuria is defined as nocturnal urine production > 130% of Expected Bladder Capacity for age.\n• Bladder Diary: 48–72 hour Frequency-Volume Chart recording fluid intake, daytime void volumes, wet/dry nights, and morning void volume." }
                ],
                "2. Stepwise Treatment Algorithms": [
                    { q: "Step 1: Behavioral & Lifestyle Interventions", a: "Protocol:\n• Regulated fluid intake: 40% morning, 40% afternoon, 20% evening. Avoid large fluid boluses within 2 hours of sleep.\n• Double voiding immediately prior to sleeping.\n• Eliminate evening caffeine, carbonated sodas, and artificial sweeteners.\n• Aggressively treat constipation (fecal impaction directly reduces functional bladder capacity)." },
                    { q: "Step 2: Enuresis Conditioning Alarm Protocol", a: "Protocol:\n• First-line curative modality for MNE (highest long-term cure rate >60%–70%).\n• Mechanism: Sensor attached to underwear triggers acoustic/vibratory alarm at initial moisture drop, conditioning arousal to bladder fullness.\n• Duration: Continued until 14 consecutive dry nights are achieved (minimum 2–3 months of therapy)." },
                    { q: "Step 3: Desmopressin (DDAVP) & Strict Fluid Protocol", a: "Protocol:\n• Drug Formulations: Oral Lyophilisate (melt) 120–240 mcg OR Oral Tablets 0.2–0.4 mg taken 1 hour before bedtime.\n• CRITICAL SAFETY RULE: Strictly limit fluid intake to ≤200 mL starting 1 hour before and lasting for 8 hours after taking desmopressin to prevent life-threatening water intoxication, cerebral edema, and dilutional hyponatremia!" },
                    { q: "Step 4: Refractory Enuresis Protocols", a: "Management:\n• Combine Desmopressin + Anticholinergic (Oxybutynin 5 mg PO at bedtime) if overactive bladder or small bladder capacity is present.\n• Third-line: Imipramine (10–25 mg at bedtime) under strict cardiac monitoring (baseline ECG to rule out long QT syndrome; lethal in accidental overdose)." }
                ]
            }
        };

        const tabsContainer = document.getElementById('diseaseTabs');
        const formSection = document.getElementById('formSection');
        const phaseSelect = document.getElementById('phaseSelect');
        const scenarioDiv = document.getElementById('scenarioDiv');
        const scenarioSelect = document.getElementById('scenarioSelect');
        const resultCard = document.getElementById('resultCard');
        const resultContent = document.getElementById('resultContent');

        let currentDisease = '';
        let currentPhase = '';

        // Render Disease Selection Tabs
        Object.keys(clinicalData).forEach(disease => {
            const btn = document.createElement('button');
            btn.className = 'px-4 py-2 bg-slate-100 text-slate-600 rounded-full text-xs font-bold hover:bg-sky-100 hover:text-sky-700 transition-colors border border-slate-200';
            btn.textContent = disease;
            btn.onclick = () => selectDisease(disease, btn);
            tabsContainer.appendChild(btn);
        });

        function selectDisease(disease, clickedBtn) {
            currentDisease = disease;
            
            Array.from(tabsContainer.children).forEach(b => {
                b.classList.remove('bg-sky-700', 'text-white', 'border-sky-800');
                b.classList.add('bg-slate-100', 'text-slate-600');
            });
            clickedBtn.classList.remove('bg-slate-100', 'text-slate-600');
            clickedBtn.classList.add('bg-sky-700', 'text-white', 'border-sky-800');

            formSection.classList.remove('hidden');
            scenarioDiv.classList.add('hidden');
            resultCard.classList.add('hidden');
            
            phaseSelect.innerHTML = '<option value="" disabled selected>Choose category or phase...</option>';
            Object.keys(clinicalData[disease]).forEach(phase => {
                const opt = document.createElement('option');
                opt.value = phase;
                opt.textContent = phase;
                phaseSelect.appendChild(opt);
            });
        }

        phaseSelect.addEventListener('change', (e) => {
            currentPhase = e.target.value;
            scenarioDiv.classList.remove('hidden');
            resultCard.classList.add('hidden');

            scenarioSelect.innerHTML = '<option value="" disabled selected>Choose specific topic...</option>';
            clinicalData[currentDisease][currentPhase].forEach((item, index) => {
                const opt = document.createElement('option');
                opt.value = index;
                opt.textContent = item.q;
                scenarioSelect.appendChild(opt);
            });
        });

        scenarioSelect.addEventListener('change', (e) => {
            const scenarioIndex = e.target.value;
            const data = clinicalData[currentDisease][currentPhase][scenarioIndex];
            
            resultContent.innerHTML = data.a.replace(/\n/g, '<br>');
            resultCard.classList.remove('hidden');
        });
    </script>
